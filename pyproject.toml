[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kf2-env-generator"
version = "0.1.0"
description = "Minimal skeleton for generating KF2-style environment project files"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8.0"]
